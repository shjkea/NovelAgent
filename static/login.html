<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovelAgent 登录</title>
<style>
:root{color-scheme:dark;--bg:#0f1114;--card:#171a1e;--line:#2a3037;--muted:#98a2ad;--text:#edf1f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}
.card{width:min(390px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:22px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
input{width:100%;margin-top:5px;background:#0d1013;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:8px}
button{width:100%;margin-top:16px;border:1px solid #4773a5;background:#315b8a;color:#fff;padding:10px;border-radius:8px;cursor:pointer}
.msg{min-height:20px;margin-top:12px;font-size:12px;color:#ff9b9b}
</style>
</head><body>
<div class="card">
<h1>NovelAgent</h1><div id="subtitle" class="muted">检查认证状态…</div>
<form id="form">
<label>用户名<input id="username" autocomplete="username" value="admin"></label>
<label>密码<input id="password" type="password" autocomplete="current-password"></label>
<button id="submit" type="submit">登录</button>
</form><div id="msg" class="msg"></div>
</div>
<script>
let setupMode=false;const $=id=>document.getElementById(id);
async function init(){const r=await fetch('/api/auth/status',{cache:'no-store'});const s=await r.json();setupMode=!s.configured;
if(setupMode){$('subtitle').textContent='首次使用：设置管理员账号和密码';$('submit').textContent='设置并登录';$('password').autocomplete='new-password';}
else{$('subtitle').textContent='请输入管理员账号和密码';if(s.username)$('username').value=s.username;}}
$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';const r=await fetch(setupMode?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});let b={};try{b=await r.json()}catch(_){}
if(!r.ok){$('msg').textContent=b.detail||'操作失败';return;}location.href='/';};init();
</script></body></html>
